[package]
name = "telegram-cybersec-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Professional Telegram bot that aggregates cybersecurity news (RSS + GitHub) and pushes categorised digests every 12 hours."
license = "MIT"
authors = ["Cybersec Bot Contributors"]

[dependencies]
# --- Telegram client ---
teloxide = { version = "0.13", features = ["macros"] }

# --- Async runtime ---
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "fs"] }

# --- HTTP + feed parsing ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
feed-rs = "2.1"

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Errors ---
anyhow = "1.0"
thiserror = "1.0"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Configuration / utilities ---
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
once_cell = "1.19"
url = "2.5"
futures = "0.3"
html-escape = "0.2"

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
